<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF 座標預覽工具</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      background: #f4f6f8;
      color: #222;
    }

    .app {
      max-width: 960px;
      margin: 0 auto;
      padding: 32px 20px 48px;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 16px;
      color: #004172;
    }

    .file-picker {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 12px 18px;
      border: 2px dashed #2d84c4;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      color: #2d84c4;
      background: #fff;
    }

    .file-picker input {
      display: none;
    }

    .status {
      margin: 16px 0 12px;
      font-size: 0.95rem;
      color: #444;
    }

    .coords {
      display: inline-flex;
      padding: 6px 12px;
      border-radius: 8px;
      background: #004172;
      color: #fff;
      font-weight: 600;
      font-feature-settings: "tnum" 1;
    }

    .viewer {
      margin-top: 18px;
      padding: 16px;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 12px 30px rgba(20, 60, 110, 0.12);
      min-height: 240px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      overflow: auto;
      position: relative;
    }

    canvas {
      width: 100%;
      height: auto;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      border-radius: 8px;
      background: #fff;
    }

    .crosshair {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      opacity: 0;
      transition: opacity 0.15s ease;
    }

    .crosshair.visible {
      opacity: 1;
    }

    .crosshair-line {
      position: absolute;
      background: rgba(45, 132, 196, 0.9);
    }

    .crosshair-line.horizontal {
      height: 1px;
      width: 100%;
      transform: translateY(-9999px);
    }

    .crosshair-line.vertical {
      width: 1px;
      height: 100%;
      transform: translateX(-9999px);
    }

    .measurement-line {
      position: absolute;
      top: 0;
      left: 0;
      height: 2px;
      background: rgba(226, 47, 15, 0.9);
      pointer-events: none;
      opacity: 0;
      transform-origin: 0 50%;
      z-index: 11;
    }

    .measurement-line.visible {
      opacity: 1;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #0f172a;
        color: #e2e8f0;
      }

      .viewer {
        background: #1e293b;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
      }

      .file-picker {
        background: rgba(45, 132, 196, 0.1);
      }

      .status {
        color: #cbd5f5;
      }

      .crosshair-line {
        background: rgba(148, 197, 255, 0.85);
      }

      .measurement-line {
        background: rgba(248, 113, 113, 0.9);
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>PDF 座標預覽工具</h1>
    <label class="file-picker">
      <span>選擇 PDF 檔案</span>
      <input type="file" id="fileInput" accept="application/pdf" />
    </label>
    <p id="status" class="status">請先上傳 PDF 檔案。</p>
    <div id="coords" class="coords">X: -, Y: -</div>
    <div id="viewer" class="viewer" aria-live="polite">
      <div id="crosshair" class="crosshair" aria-hidden="true">
        <div id="crosshairHorizontal" class="crosshair-line horizontal"></div>
        <div id="crosshairVertical" class="crosshair-line vertical"></div>
      </div>
      <div id="measurementLine" class="measurement-line" aria-hidden="true"></div>
    </div>
  </main>

  <script src="./vendor/pdfjs/pdf.min.js"></script>
  <script>
    const fileInput = document.getElementById('fileInput');
    const viewer = document.getElementById('viewer');
    const statusEl = document.getElementById('status');
    const coordsEl = document.getElementById('coords');
    const crosshair = document.getElementById('crosshair');
    const crosshairHorizontal = document.getElementById('crosshairHorizontal');
    const crosshairVertical = document.getElementById('crosshairVertical');
    const measurementLine = document.getElementById('measurementLine');

    let measurementStart = null;
    let measurementLocked = false;

    const hideCrosshair = () => {
      crosshair.classList.remove('visible');
    };

    const showCrosshairAt = (x, y) => {
      crosshairHorizontal.style.transform = `translateY(${y}px)`;
      crosshairVertical.style.transform = `translateX(${x}px)`;
      crosshair.classList.add('visible');
    };

    const resetMeasurement = () => {
      measurementStart = null;
      measurementLocked = false;
      measurementLine.classList.remove('visible');
      measurementLine.style.transform = '';
      measurementLine.style.width = '';
    };

    const getViewerPoint = (event) => {
      const rect = viewer.getBoundingClientRect();
      return {
        x: event.clientX - rect.left,
        y: event.clientY - rect.top,
      };
    };

    const getPdfPoint = (event, canvas) => {
      const rect = canvas.getBoundingClientRect();
      const cssX = event.clientX - rect.left;
      const cssY = event.clientY - rect.top;
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const canvasX = cssX * scaleX;
      const canvasY = cssY * scaleY;
      const viewport = canvas._pdfViewport;
      const [pdfX, pdfY] = viewport
        ? viewport.convertToPdfPoint(canvasX, canvasY)
        : [canvasX, canvas.height - canvasY];
      return { pdfX, pdfY };
    };

    const drawMeasurementLine = (startPoint, endPoint) => {
      const dx = endPoint.viewerX - startPoint.viewerX;
      const dy = endPoint.viewerY - startPoint.viewerY;
      const length = Math.hypot(dx, dy);
      const angle = Math.atan2(dy, dx);
      measurementLine.style.width = `${length}px`;
      measurementLine.style.transform = `translate(${startPoint.viewerX}px, ${startPoint.viewerY}px) rotate(${angle}rad)`;
      measurementLine.classList.add('visible');
    };

    const startMeasurement = (point) => {
      measurementStart = point;
      measurementLocked = false;
      measurementLine.classList.remove('visible');
      measurementLine.style.transform = '';
      measurementLine.style.width = '';
      coordsEl.textContent = `起點 頁 ${point.page} | X: ${point.pdfX.toFixed(1)}, Y: ${point.pdfY.toFixed(1)}`;
    };

    const completeMeasurement = (endPoint) => {
      if (!measurementStart) {
        return;
      }

      drawMeasurementLine(measurementStart, endPoint);
      const deltaX = endPoint.pdfX - measurementStart.pdfX;
      const deltaY = endPoint.pdfY - measurementStart.pdfY;
      coordsEl.textContent = `ΔX: ${deltaX.toFixed(1)}, ΔY: ${deltaY.toFixed(1)} (頁 ${measurementStart.page} → ${endPoint.page}) | 按 ESC 取消紅線`;
      measurementStart = null;
      measurementLocked = true;
    };

    const handleLeftClick = (event, canvas) => {
      const { pdfX, pdfY } = getPdfPoint(event, canvas);
      const page = canvas.dataset.page || '?';
      const message = `頁碼 ${page} | X: ${pdfX.toFixed(1)}, Y: ${pdfY.toFixed(1)}`;
      coordsEl.textContent = message;
      alert(message);
    };

    const handleRightClick = (event, canvas) => {
      if (measurementLocked) {
        return;
      }

      const { pdfX, pdfY } = getPdfPoint(event, canvas);
      const { x, y } = getViewerPoint(event);
      const page = canvas.dataset.page || '?';
      const point = { pdfX, pdfY, viewerX: x, viewerY: y, page };

      if (!measurementStart) {
        startMeasurement(point);
        return;
      }

      completeMeasurement(point);
    };

    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = './vendor/pdfjs/pdf.worker.min.js';
    }

    fileInput.addEventListener('change', async (event) => {
      const file = event.target.files?.[0];
      if (!file) {
        return;
      }

      viewer.innerHTML = '';
      viewer.appendChild(crosshair);
      viewer.appendChild(measurementLine);
      hideCrosshair();
      resetMeasurement();
      coordsEl.textContent = 'X: -, Y: -';
      statusEl.textContent = 'PDF 讀取中，請稍候…';

      try {
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        statusEl.textContent = `成功載入，共 ${pdf.numPages} 頁。`;

        for (let pageNum = 1; pageNum <= pdf.numPages; pageNum += 1) {
          const page = await pdf.getPage(pageNum);
          const initialViewport = page.getViewport({ scale: 1 });
          const availableWidth = viewer.clientWidth || 800;
          const scale = availableWidth / initialViewport.width;
          const viewport = page.getViewport({ scale });

          const canvas = document.createElement('canvas');
          canvas.height = viewport.height;
          canvas.width = viewport.width;
          canvas.dataset.page = String(pageNum);
          canvas._pdfViewport = viewport;
          viewer.appendChild(canvas);

          const renderContext = {
            canvasContext: canvas.getContext('2d', { willReadFrequently: false }),
            viewport,
          };

          await page.render(renderContext).promise;
        }
      } catch (error) {
        console.error(error);
        statusEl.textContent = 'PDF 載入失敗，請確認檔案是否為有效的 PDF。';
      }
    });

    viewer.addEventListener('pointermove', (event) => {
      const rect = viewer.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;

      if (x < 0 || y < 0 || x > rect.width || y > rect.height) {
        hideCrosshair();
        return;
      }

      showCrosshairAt(x, y);
    });

    viewer.addEventListener('pointerleave', hideCrosshair);

    viewer.addEventListener('contextmenu', (event) => {
      event.preventDefault();
    });

    viewer.addEventListener('pointerdown', (event) => {
      const canvas = event.target.closest('canvas');
      if (!canvas || !viewer.contains(canvas)) {
        if (event.button === 2) {
          event.preventDefault();
        }
        return;
      }

      if (event.button === 0) {
        handleLeftClick(event, canvas);
      } else if (event.button === 2) {
        event.preventDefault();
        handleRightClick(event, canvas);
      }
    });

    window.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        resetMeasurement();
        coordsEl.textContent = 'X: -, Y: -';
      }
    });
  </script>
</body>
</html>
